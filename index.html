  <!-- 4. API -->
  <script>
    window.API = {
      async getProfiles({ limit=20, category, search }={}) {
        let q = sb.from("wb_profiles")
          .select("id,slug,name,category,short_bio,photo_url,tier,views_count,nationality,birth_date,tags")
          .in("status",["approved","live"])
          .order("views_count",{ascending:false})
          .limit(limit);
        if (category && category!=="All") q = q.eq("category",category);
        if (search) q = q.ilike("name",`%${search}%`);
        return await q;
      },
      async getProfile(slug) {
        return await sb.from("wb_profiles").select("*").eq("slug",slug).in("status",["approved","live"]).single();
      },
      async createProfile(profileData, userId) {
        const slug = profileData.name.toLowerCase().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-");
        const schemaJson = {
          "@context":"https://schema.org",
          "@type": profileData.category==="Brand"?"Organization":"Person",
          "name": profileData.name, "jobTitle": profileData.category,
          "birthDate": profileData.birth_date, "nationality": profileData.nationality,
          "description": profileData.short_bio, "image": profileData.photo_url,
          "url": `https://wiki-bio.vercel.app/#/p/${slug}`
        };
        return await sb.from("wb_profiles").insert({...profileData, slug, schema_json:schemaJson, status:"pending", created_by:userId}).select().single();
      },
      async getPendingProfiles() {
        return await sb.from("wb_profiles").select("*").eq("status","pending").order("created_at",{ascending:false});
      },
      async getAllProfiles({ limit=50, status, page=0 }={}) {
        let q = sb.from("wb_profiles").select("*",{count:"exact"}).order("created_at",{ascending:false}).range(page*limit,(page+1)*limit-1);
        if (status) q = q.eq("status",status);
        return await q;
      },
      async reviewProfile(profileId, action, reviewerId, note="") {
        const newStatus = action==="approve"?"live":action==="reject"?"rejected":"pending";
        const { error:pErr } = await sb.from("wb_profiles").update({status:newStatus, published_at:action==="approve"?new Date().toISOString():null}).eq("id",profileId);
        if (pErr) return { error:pErr };
        return await sb.from("wb_reviews").insert({profile_id:profileId, reviewer_id:reviewerId, action, note}).select().single();
      },
      async getStats() {
        const [total,pending,live,users] = await Promise.all([
          sb.from("wb_profiles").select("id",{count:"exact",head:true}),
          sb.from("wb_profiles").select("id",{count:"exact",head:true}).eq("status","pending"),
          sb.from("wb_profiles").select("id",{count:"exact",head:true}).eq("status","live"),
          sb.from("wb_users").select("id",{count:"exact",head:true}),
        ]);
        return { total:total.count||0, pending:pending.count||0, live:live.count||0, users:users.count||0 };
      },
      async fetchFromWikipedia(title) {
        try {
          const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
          if (!res.ok) throw new Error("Topilmadi");
          const d = await res.json();
          return { data:{ name:d.title, short_bio:d.description, full_bio:[{title:"Biography",body:d.extract}], photo_url:d.thumbnail?.source||null, wikipedia_url:d.content_urls?.desktop?.page, category:d.description||"Person" }, error:null };
        } catch(e) { return { data:null, error:e.message }; }
      },
      async saveImport(wikiTitle, rawData) {
        return await sb.from("wb_imports").insert({wikipedia_title:wikiTitle, wikipedia_url:rawData.wikipedia_url, raw_data:rawData, status:"pending"}).select().single();
      },
      async uploadPhoto(file, userId, type="portrait") {
        const ext = file.name.split(".").pop();
        const path = `${userId}/${type}-${Date.now()}.${ext}`;
        const { error } = await sb.storage.from("wb-photos").upload(path, file, {upsert:true});
        if (error) return { url:null, error };
        const { data:{ publicUrl } } = sb.storage.from("wb-photos").getPublicUrl(path);
        return { url:publicUrl, error:null };
      }
    };
  </script>
